# yaml-language-server: $schema=https://raw.githubusercontent.com/flipt-io/flipt/v2/config/flipt.schema.json
analytics:
  storage:
    prometheus:
      enabled: true
      url: http://prometheus:9090
      headers:
        Authorization: ${env:PROMETHEUS_AUTH_TOKEN}

authentication:
  required: true
  exclude:
    evaluation: true
    ofrep: true
  session:
    domain: "localhost:8080"
    secure: false
    csrf:
      key: "enabled"
  methods:
    token:
      enabled: true
      storage:
        tokens:
          demo_token:
            credential: super_token_secret
            metadata:
              label: admin
          chaosmonkey_token:
            credential: chaosmonkey_secret
            metadata:
              label: default

    oidc:
      enabled: true
      providers:
        gitea:
          issuer_url: "http://gitea.docker.localhost:3000/"
          client_id: 1b49e255-c90c-400f-9e57-cf43238f9717
          client_secret: gto_76jd2kuc3cuim5jxmk5egop2vfogofsu4a3xtkq3iq2vh7xtriwa
          redirect_address: "http://localhost:8080"
          use_pkce: true
          fetch_extra_user_info: true
          scopes:
            - email
            - profile
authorization:
  required: true
  backend: local
  local:
    policy:
      poll_interval: 5m
      path: "/etc/flipt/config/policy.rego"

credentials:
  gitea:
    type: basic
    basic:
      username: admin
      password: password

environments:
  onoffinc:
    default: true
    name: "onoffinc"
    storage: "onoffinc"
#    scm:
#      type: gitea
#      api_url: http://gitea.docker.localhost:3000/
#      credentials: gitea

storage:
  onoffinc:
    remote: "http://ogit:8080/onoffinc-features.git"
    branch: "main"
    poll_interval: "30s"
    fetch_policy: "lenient"
    backend:
      type: memory
