services:
  localstack:
    image: localstack/localstack:3.8.0
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "4566:4566"
    networks:
      - flipt_network
    healthcheck:
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack-init:
    build:
      context: ./init
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "/init/localstack-init.sh"]
    networks:
      - flipt_network
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1

  ogit:
    build:
      context: ./ogit-src
      dockerfile: Dockerfile
    image: ogit:local-v1
    volumes:
      - ./ogit/config.yaml:/config/config.yaml
    ports:
      - "8088:8080"
    networks:
      - flipt_network
    depends_on:
      localstack-init:
        condition: service_completed_successfully

  ogit-init:
    build:
      context: ./init
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "/init/ogit-init.sh"]
    networks:
      - flipt_network
    depends_on:
      ogit:
        condition: service_started
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1

